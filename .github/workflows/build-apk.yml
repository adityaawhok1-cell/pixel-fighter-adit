name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Buat project Android
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Terapkan landscape, fullscreen, ikon
        run: |
          A=android/app/src/main
          # 1) kunci landscape
          sed -i '0,/<activity/s//<activity android:screenOrientation="sensorLandscape"/' $A/AndroidManifest.xml
          # 2) tema gelap + fullscreen + isi area notch
          python3 - <<'PY'
          import re
          p='android/app/src/main/res/values/styles.xml'
          s=open(p,encoding='utf-8').read()
          items=('<item name="android:windowFullscreen">true</item>'
                 '<item name="android:windowBackground">#05050F</item>'
                 '<item name="android:statusBarColor">#05050F</item>'
                 '<item name="android:navigationBarColor">#05050F</item>'
                 '<item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>')
          s,n=re.subn(r'(<style name="AppTheme\.NoActionBar"[^>]*>)',r'\1'+items,s,count=1)
          assert n==1,'style AppTheme.NoActionBar tidak ditemukan'
          open(p,'w',encoding='utf-8').write(s)
          PY
          # 3) immersive + cegah gestur tepi layar menutup aplikasi + back 2x untuk keluar
          cat > $A/java/com/pixelfighter/game/MainActivity.java <<'JAVA'
          package com.pixelfighter.game;

          import android.graphics.Rect;
          import android.os.Build;
          import android.view.View;
          import android.widget.Toast;
          import androidx.activity.OnBackPressedCallback;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends BridgeActivity {
            private long lastBack = 0;

            @Override
            public void onStart() {
              super.onStart();
              getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                @Override
                public void handleOnBackPressed() {
                  long now = System.currentTimeMillis();
                  if (now - lastBack < 1500) {
                    setEnabled(false);
                    getOnBackPressedDispatcher().onBackPressed();
                  } else {
                    lastBack = now;
                    Toast.makeText(MainActivity.this, "Tekan KEMBALI sekali lagi untuk keluar", Toast.LENGTH_SHORT).show();
                  }
                }
              });
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) {
                WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                c.hide(WindowInsetsCompat.Type.systemBars());
                excludeEdges();
              }
            }

            private void excludeEdges() {
              if (Build.VERSION.SDK_INT < 29) return;
              final View v = getWindow().getDecorView();
              v.post(new Runnable() {
                @Override
                public void run() {
                  int w = v.getWidth(), h = v.getHeight();
                  int edge = (int) (48 * v.getResources().getDisplayMetrics().density);
                  List<Rect> r = new ArrayList<>();
                  r.add(new Rect(0, 0, edge, h));
                  r.add(new Rect(w - edge, 0, w, h));
                  v.setSystemGestureExclusionRects(r);
                }
              });
            }
          }
          JAVA
          # 4) ikon & splash
          [ -f res-overrides.zip ] && unzip -oq res-overrides.zip -d $A/res || true
          # 5) versionCode naik otomatis
          sed -i -E "s/versionCode [0-9]+/versionCode $((100 + GITHUB_RUN_NUMBER))/" android/app/build.gradle
      - name: Pasang plugin Net
        run: python3 inject_net.py .
      - name: Build
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: pixel-fighter-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
